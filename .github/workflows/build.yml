name: osc-sdk-rust release build

on:
  workflow_dispatch:
    inputs:
      api_version:
        description: 'Outscale API version'
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-build:
    environment: auto-build
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          nix shell github:nix-community/fenix?ref=ba9210be006df88ed8c14562f97ad4b4ffb048a0#stable.defaultToolchain --command "env" | egrep "^PATH=" >>"${GITHUB_ENV}"

      - name: Write Outscale API version to use
        run: echo "$API_VERSION" > api_version
        env:
          API_VERSION: ${{ github.event.inputs.api_version }}
      - name: auto-generate release
        run: make release-build

      - name: Get SDK version
        id: get-sdk-version
        run: |
          echo "sdk_version=$(cat ./sdk_version)" >> "$GITHUB_OUTPUT"
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          commit-message: "🔖 release: osc-sdk-rust v${{ env.sdk_version }}"
          body: |
            Automatic build of SDK v${{ env.sdk_version }} version based on Outscale API ${{ env.api_version }}.
          title: "SDK v${{ env.sdk_version }}"
          labels: "kind/feature"
        env:
          sdk_version: ${{ steps.get-sdk-version.outputs.sdk_version }}
          api_version: ${{ github.event.inputs.api_version }}
